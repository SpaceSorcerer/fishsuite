# ############################################################################
# ##                                                                        ##
# ##   ███  FINAL ANALYSIS RUN — MIAT x QKI, PINNED PLANES, 44 IMAGES       ##
# ##                                                                        ##
# ##   This is the analysis of record for the direct MIAT-QKI association   ##
# ##   measurements. Its outputs are citable; the QC pass's are not.        ##
# ##                                                                        ##
# ##   ★ THE NULLS ARE OFF AND ARE RETROFITTED AFTERWARDS. Brian's call:    ##
# ##   deliver the DIRECT measurements first (footprint enrichment,         ##
# ##   capacity, association ratio, the tracking-regression axes), then     ##
# ##   add the nulls with `fishsuite backfill --rotation`, which is         ##
# ##   CPU-only and operates on this completed run directory.               ##
# ##                                                                        ##
# ##   ★★ READ §BACKFILL BEFORE RELYING ON THAT PLAN. Backfill restores the ##
# ##   nulls at PER-IMAGE granularity into SEPARATE CSVs. It does NOT write ##
# ##   per-nucleus columns, so `rotation_null_usable` (the plan's stated    ##
# ##   pre-aggregation filter) and the per-nucleus association fraction     ##
# ##   (the "% of MIAT spots co-occupied" figure) will NOT exist. That is a ##
# ##   real cost of the sequencing decision, not a defect — but it is a     ##
# ##   cost, and it should be an informed one.                              ##
# ##                                                                        ##
# ############################################################################
# ============================================================================
# MIAT (647 RNA-FISH) x QKI (568 IF) — FINAL PINNED-PLANE RUN — 100x
# Date: 2026-08-14 | acquisition 2026-08-12 | for MASTER CONTROL
#
# LINEAGE: miat_kd_qki_647_100x_2026-08-12 (inferred metadata)
#       -> miat_kd_qki_647_100x_2026-08-13 (measured metadata, 65 nm rescale)
#       -> miat_kd_qki_647_100x_QCPASS_2026-08-13 (QC + calibration, 51 images)
#       -> THIS FILE (final, 44 images, pinned planes, calibrated floor)
# Read the 08-13 preset for the measured-metadata provenance and the 65 nm
# rescale derivation; not repeated here.
#
# UNCHANGED FROM THE 08-13 PRESET: every *_px value and the 65 nm voxel size;
# channel indices 0/1/2 with their labels and LUTs; joint autofocus parameters;
# detect_antibody_spots false; nucleolus on; cytoplasm on; seed 0; conditions
# and sec-only wiring; the slide-carrying per-well labels.
#
# ── §WHAT CHANGED FOR THE FINAL RUN ────────────────────────────────────────
#   1. MIAT SPOT FLOOR PINNED at 364.0 (foci.rna_overrides.min_spot_peak_intensity)
#   2. 44-image roster via input_file_subset (7 images excluded — see §ROSTER)
#   3. PINNED z-planes, one per file, from the QC pass's autofocus picks
#   4. Manual display floors (pub_contrast_mode: manual)
#   5. sampling.on_short: keep -> fail (the roster is now triaged)
#   6. Position null, rotation null and radial profile OFF; partner intensity
#      and footprint enrichment ON
#
# ── §THE FLOOR — 364.0, AND WHY NOT THE CALIBRATED 3058 ────────────────────
#   Brian's call, and the QC pass supports it. The P99-of-omission statistic
#   returned 3058, but that percentile chased a bright-debris tail: applying it
#   would have discarded the overwhelming majority of real MIAT spots for no
#   gain in signal-to-control. 364.0 retains essentially all real spots at a
#   large signal-to-control margin. Re-derive both figures from the QC pass's
#   `QC_ANALYSIS/02_calibrate_floor/` before quoting either — they are dated
#   observations, not standing facts.
#
#   ★ TWO DIFFERENT FLOORS, BOTH SET TO 364.0, AND THEY ARE NOT THE SAME KNOB:
#     - foci.rna_overrides.min_spot_peak_intensity: 364.0  <- DETECTION. Drops
#       spots below the floor right after BigFISH, before any measurement.
#     - output.manual_rna_min: 364.0                       <- DISPLAY, and it
#       also becomes the `rna_thresh_*` integration floor (see §DISPLAY).
#   They are deliberately the same number so the thresholded-intensity columns
#   integrate over exactly the pixel population the spot caller accepted.
#   `apply_pub_contrast_floor_to_spots` STAYS FALSE — the display floor must
#   never gate detection; detection gating is the override above. Setting it
#   true would double-gate.
#
#   Higher floors belong in a POST-HOC sensitivity sweep (0.8x/1.0x/1.2x, each
#   in its own output dir), not in this run.
#
# ── §ROSTER — 44 IMAGES, EXCLUSIONS ARE A STATED RULE ──────────────────────
#   Verified against the live catalog: 51 discovered, 7 excluded, 44 kept =
#   17 NT (6 wells) + 15 KD (5 wells) + 12 omission. Each exclusion basename
#   was confirmed to EXIST before being excluded — an exclusion that matches
#   nothing silently excludes nothing.
#
#   EXCLUDED:
#     NT_s1w1 FOV 07  — 1 image. Brian's visual call.
#     KD_s1w6 FOVs 15,16,17,18,19,20 — the WHOLE WELL, 6 images (3 from the
#       p2_ folder + 3 from the p2r_ reshoot, which is the same physical well).
#       Brian flagged it by eye; independently the five highest cytoplasmic-QKI
#       images in the dataset are all well 6. A well-level defect is dropped at
#       the well, not per-FOV — cherry-picking within a bad well is the worse
#       error. This drops KD from 6 wells to 5.
#   RETAINED explicitly, having been checked and cleared: KD_s1w5 FOVs 12, 13.
#
#   ★ input_file_subset matching ZERO files raises RuntimeError (runner.py:588),
#   but a subset matching the WRONG COUNT is silent. The dry-run roster must
#   read exactly 44. Assert the per-condition counts, not just the total.
#
# ── §Z — PINNED, ONE PLANE PER FILE ────────────────────────────────────────
#   mode stays `autofocus` with a DEGENERATE file_override window
#   {start_slice: F, end_slice: F} per file — the documented pinning pattern:
#   the search range collapses to a single plane, so the pick is forced to F.
#   All 44 pins come from the QC pass's own autofocus picks
#   (`QC_ANALYSIS/06_make_pin_overrides/resolved_pins.csv`, pin_source =
#   autofocus for all 44, zero manual overrides). No plane was moved by hand.
#
#   ★ PINNED PLANES OUTSIDE BRIAN'S IDEAL 10-17 WINDOW — 13 of 44, REPORTED
#   NOT MOVED. The pattern is not random and it matters:
#     - STAINED images (n=32): z 8-19, median 13. Only three sit outside
#       10-17 — KD_s2w4 FOV 38 at z=8, KD_s1w4 FOV 11 at z=9, KD_s1w5 FOV 14
#       at z=19. All within the 8-23 acceptable window.
#     - OMISSION images (n=12): z 16-27, median 22.5. TEN of the twelve sit
#       above 17, and TWO EXCEED even the 8-23 acceptable window —
#       Sec-Only-MIAT-QKI-NT_55 at z=26 and _59 at z=27.
#   LIKELY MECHANISM: joint autofocus multiplies per-channel normalised focus
#   scores across DAPI + MIAT + QKI. In an omission well two of those three
#   channels carry no specific signal, so the product is driven by noise in two
#   of its three terms and the pick drifts. The stained and omission z
#   distributions barely overlap.
#   CONSEQUENCE TO STATE, NOT HIDE: the omission wells are the floor-calibration
#   set and the display reference band, and they are being read at
#   systematically deeper planes than the images they calibrate. "Same z
#   treatment for samples and control" is true in method and only approximate
#   in fact. This does not invalidate the 364.0 floor — that floor was
#   calibrated on the QC pass, which made these same picks — but any statement
#   that the omission band is z-matched to the samples needs this caveat.
#
# ── §NULLS OFF, AND §BACKFILL — WHAT COMES BACK AND WHAT DOES NOT ─────────
#   OFF here: compute_partner_null_enrichment, compute_partner_rotation_null,
#   save_partner_null_draws, save_partner_rotation_null_draws,
#   compute_partner_radial_profile.
#   ON here: compute_partner_intensity, compute_footprint_enrichment — these
#   are the DIRECT measurements: qki_at_miat_footprint, miat_footprint_area_px,
#   qki_footprint_enrichment (per spot); qki_assoc_ratio_continuous,
#   qki_associated_with_miat, miat_mass_nuclear, capacity_qki_at_miat,
#   qki_at_miat_foci_enrichment (per nucleus). The last two per-nucleus names
#   are the x and y of the tracking regression.
#
#   ★ RADIAL PROFILE IS OFF — recommendation, not an instruction. Verified in
#   source: `_radial_profile_for_nucleus` (core/modes/rna_rna.py:629-650) takes
#   `n_null` and draws `rng.integers(0, npix, size=n_null * n_sp)`, and the call
#   site passes `_null_n = int(cfg.foci.partner_null_n)` (rna_rna.py:1953) —
#   i.e. 1000 draw-sets per nucleus, the SAME order of cost as the position null
#   being removed. (One position set is reused across all four rings, so it is
#   ~1x that cost, not 4x — but it is not free either.) Keeping it on would give
#   back much of the saving, it is a null-based specificity check of exactly the
#   kind Brian deferred, and backfill computes it by default. So: off, and it
#   returns with the nulls in a single CPU pass.
#
#   ★★ WHAT BACKFILL CAN AND CANNOT RESTORE — VERIFIED IN
#   core/coloc_backfill.py, because this decision rests on it:
#     CAN — both nulls, post-hoc, CPU-only, no GPU and no re-segmentation. It
#       reuses this run's saved nucleus masks and MIAT spot coordinates and
#       recomputes the analysis z-plane deterministically. `--rotation` adds the
#       rotation null; null draws and the radial profile are ON by default
#       (`--no-null-draws` / `--no-radial` to skip).
#     CANNOT — write PER-NUCLEUS columns. It never touches nuclei_metrics.csv
#       (the string does not appear in its write path) and never rewrites
#       per_image_summary.csv. It emits SEPARATE files: coloc_null_draws.csv,
#       coloc_null_summary.csv, coloc_radial_profile.csv,
#       coloc_rotation_null_draws.csv, coloc_rotation_null_summary.csv. The
#       summary rows are keyed (image, condition) with n_nuclei_used — per
#       image, never per nucleus.
#     THEREFORE THESE WILL NOT EXIST after backfill, and they are named
#     deliverables in the analysis plan:
#       * rotation_null_usable        — the plan's stated per-nucleus filter
#                                       ("filter rotation_null_usable == True
#                                       before any coloc aggregation")
#       * rotation_median_retention
#       * protein_rotation_assoc_fraction_at_rna1_spots — the per-nucleus
#         "% of MIAT spots co-occupied" figure (plan figure F3)
#       * the per-nucleus enrichment/z columns for both nulls, so well-level
#         aggregation of coloc must start at the IMAGE level, not the nucleus
#     ALSO LOST: backfill SELF-VALIDATES by reproducing the run's stored
#       protein_pooled_* columns. With the nulls off in the run those columns
#       do not exist, so the validation gate has no reference to check against.
#   If any of that is load-bearing, the fix is to turn the two null flags back
#   on HERE and pay the GPU time once. Raise it before launching.
#
# ── §DISPLAY — MANUAL FLOORS, AND THE ONE THAT IS NOT COSMETIC ────────────
#   pub_contrast_mode: manual with all four channel pairs typed. MIAT 364-1888
#   and QKI 563-2500 are Brian's (superseding the earlier 300-3200 / 531-2360).
#   The antibody pair is mirrored into manual_rna2_min/max because the renderer
#   may read the rna2 slot.
#   DAPI 334-2419 is NOT invented: it is the value the QC pass actually applied,
#   read from its run_config.json `batch_contrast.dapi` (floor 334.0, ceil
#   2419.0). Using the measured applied value keeps the final images comparable
#   to the QC pass's.
#   ★ manual mode is NOT cosmetic-only: runner.py:1475-1497 mirrors every typed
#   manual_*_min/max pair into `batch_contrast`, which runner.py:1633 turns into
#   `analysis_floors`. So manual_rna_min 364.0 becomes the `rna_thresh_*`
#   integration floor. Typing ALL FOUR pairs also means `_manual_needs_autobatch`
#   is False and the auto_batch pre-scan is skipped entirely — a real saving,
#   and safe ONLY because every pair is typed. Leave one pair unset and the
#   pre-scan silently runs again.
#
# ── §HOW TO RUN ────────────────────────────────────────────────────────────
#   fishproc_dml env, ONE GPU run at a time, foreground, --dry-run FIRST and
#   CHECK THE ROSTER READS 44. -p 1 is REQUIRED: compute_partner_intensity runs
#   an in-process per-spot loop that hangs the parallel pool.
# ============================================================================

experiment:
  name: "FINAL_MIAT_KD_QKI_647_100x_2026-08-14"
  description: "FINAL pinned-plane MIAT(647 RNA-FISH) x QKI(568 IF, rabbit/Fortis) rna_protein run — the analysis of record for the DIRECT association measurements. Acquired 2026-08-12; QC pass 2026-08-13; final preset 2026-08-14. 44-image roster via input_file_subset (51 discovered, 7 excluded: NT_s1w1 FOV 07, and the whole KD_s1w6 well = FOVs 15-20 across the p2_ and p2r_ reshoot folders) giving 17 NT / 6 wells + 15 KD / 5 wells + 12 omission; every exclusion basename was confirmed to exist before being excluded. MIAT spot floor PINNED at 364.0 via foci.rna_overrides.min_spot_peak_intensity (Brian's call; the P99-of-omission statistic returned 3058 but chased a bright-debris tail and would have discarded the great majority of real spots for no signal-to-control gain — higher floors belong in a post-hoc sweep). Display floors manual: MIAT 364-1888, QKI 563-2500 mirrored into rna2, DAPI 334-2419 read from the QC pass's applied batch_contrast rather than invented; manual mode mirrors these into batch_contrast so manual_rna_min also becomes the rna_thresh_* integration floor, and typing all four pairs skips the auto_batch pre-scan. apply_pub_contrast_floor_to_spots stays FALSE — display never gates detection; detection is gated by the min_spot_peak_intensity override. All 44 z-planes PINNED from the QC pass's own autofocus picks via degenerate {start_slice: F, end_slice: F} overrides, pin_source autofocus for all 44 with zero manual moves. NULLS OFF by Brian's sequencing decision (position null, rotation null, radial profile, and both save_*_draws) with partner intensity and footprint enrichment ON, to deliver the direct measurements first; the nulls are retrofitted via CPU-only `fishsuite backfill --rotation`. CAVEAT VERIFIED IN core/coloc_backfill.py: backfill restores both nulls only at PER-IMAGE granularity into separate CSVs and never writes per-nucleus columns, so rotation_null_usable (the plan's stated pre-aggregation filter), rotation_median_retention and the per-nucleus association fraction will not exist, and the backfill self-validation gate loses its reference. sampling.on_short is now fail, the roster having been triaged. Human/Homo sapiens, H9 hESC undifferentiated."
  cell_line: "H9 hESC (undifferentiated)"
  date: "2026-08-12"          # ACQUISITION date. Final preset written 2026-08-14.

