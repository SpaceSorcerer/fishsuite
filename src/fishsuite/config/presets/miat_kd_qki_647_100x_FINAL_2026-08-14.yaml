  rna: 0                        # C0 = "640 CSU" -> MIAT      (PUNCTATE slot)
  antibody: 1                   # C1 = "561 CSU" -> QKI IF    (DIFFUSE partner slot)
  rna2: -1
  one_indexed: false
  dapi_label: "DAPI"
  rna_label: "MIAT-647"
  antibody_label: "QKI-568"
  dapi_lut: "blue"
  rna_lut: "yellow"
  antibody_lut: "magenta"

z_stack:
  # PINNED. mode stays `autofocus`; each file's degenerate {F, F} window
  # collapses the search to one plane, which is the documented pin pattern.
  # The joint-autofocus parameters below are therefore inert for pinned files
  # but are retained so the config still describes how the pins were derived.
  mode: autofocus
  autofocus_channel: joint
  autofocus_joint_reduce: product
  autofocus_joint_nuclear_mask: true
  autofocus_intensity_weighted: true
  focus_central_fraction: 1.0
