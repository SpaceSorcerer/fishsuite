nuclei:
  backend: cellpose
  cellpose_model_type: cpsam
  cellpose_diameter_px: 200.0          # ~13 um nucleus @ the measured 0.065 um/px
  cellpose_flow_threshold: 0.4
  cellpose_cellprob_threshold: 0.0
  cellpose_downsample_factor: 4.0      # ds4 -> 0.260 um/px seg grid; 2304/4 = 576 px
  cellpose_device: directml            # AMD RX 6750 XT; REQUIRES the fishproc_dml env
  min_area_px: 16000                   # 67.6 um^2
  max_area_px: 1000000000000.0
  exclude_border: true
  border_margin_px: 20                 # 1.3 um
  stardist_model: 2D_versatile_fluo
  prob_threshold: 0.5
  nms_threshold: 0.5
  stardist_gauss_sigma: 3.0
  stardist_postprocess: none
  label_smoothing_radius_px: 0
  reject_ghost_nuclei: false

sampling:
  enabled: true
  n_per_unit: 10
  unit: per_image
  order: random
  seed: 0
  on_short: fail        # ★ CHANGED from `keep`. The roster is now triaged, so a
                        # field with <10 eligible nuclei should not exist —
                        # `fail` is therefore an ASSERTION that should never
                        # fire, not a filter. If it does fire, something changed
                        # since the QC pass; investigate rather than relaxing it.

pixel_coloc:
  threshold_mode: mad
  threshold_scope: batch    # also the segmentation cache (runner.py:629-634) — keeps
                            # each image segmented exactly once
  k_mad: 2.5

spot_coloc:
  pair_distance_um: 0.3     # ~4.6 px @ 0.065 um/px. INERT — detect_antibody_spots false.
  report_nn_distance: true

foci:
  enabled: true
  backend: bigfish
  bigfish_voxel_size_nm: 65.0          # MEASURED, uniform 88/88, UNBINNED
  bigfish_voxel_z_nm: 0.0
  bigfish_spot_radius_nm: 120.0        # physical; 1.85 px at 65 nm/px
  bigfish_spot_radius_z_nm: 350.0      # MEASURED z-step
  threshold_multiplier: 1.0
  only_nuclear_spots: true
  min_sep_px: 1                        # Fiji-NMS knob; inert in the BigFISH wrapper
  detect_in_sec_only: true             # omission wells still detected and REPORTED
  detect_antibody_spots: false         # QKI is nucleoplasm-filling: no thresholdable object
  # ★ THE DETECTION FLOOR. Not the display floor — see §THE FLOOR.
  rna_overrides:
    min_spot_peak_intensity: 364.0     # Brian's call. Drops sub-floor spots straight
                                       # after BigFISH, before any measurement.
  # ── DIRECT MEASUREMENTS: ON ──
  compute_partner_intensity: true          # QKI intensity at each MIAT spot -> REQUIRES -p 1
  compute_footprint_enrichment: true       # per-spot footprint + per-nucleus capacity /
                                           # association ratio / miat_mass_nuclear —
                                           # the tracking-regression axes
  # ── NULLS: OFF, retrofitted via `fishsuite backfill --rotation`. See §BACKFILL
  #    for exactly what does and does not come back. ──
  compute_partner_null_enrichment: false
  compute_partner_rotation_null: false
  compute_partner_radial_profile: false    # ~1x the position-null draw cost (rna_rna.py:629-650
                                           # with _null_n = partner_null_n, rna_rna.py:1953);
                                           # backfill computes it by default
  save_partner_null_draws: false
  save_partner_rotation_null_draws: false
  # Inert while the flags above are false; retained so re-enabling is a pure
  # flag flip and no value can drift in the meantime.
  partner_null_n: 1000
  partner_null_disk_px: 6.0                # 0.39 um at 65 nm/px
  partner_null_seed: 0
  exclude_nucleolus_from_partner_null: true
  partner_radial_bins_um: [0.25, 0.5, 0.75, 1.0]
  partner_rotation_n: 1000
  partner_rotation_seed: 0
  partner_rotation_min_retention: 0.5
  partner_rotation_assoc_percentile: 95.0
  # assoc_qki_floor UNSET (None => OFF) — the primary continuous association
  # metric is floor-free; the gated variant is not needed for this run.

cytoplasm:
  enabled: true
  voronoi_max_expansion_px: 80         # 5.2 um @ 0.065 um/px
  measure_nc_ratio: true

nucleolus:
  enabled: true                        # carved from the nulls when they are backfilled;
                                       # QC pass confirmed detection is non-degenerate

output:
  save_qc_overlays: true
  save_per_image_csv: true
  save_masks: true                     # ★ REQUIRED for backfill — it reuses these saved
                                       # nucleus label masks rather than re-segmenting.
                                       # Do not turn this off on a run you intend to backfill.
  save_publication_images: true
  save_publication_tifs: false
  # ── MANUAL DISPLAY FLOORS — all four pairs typed. See §DISPLAY. ──
  pub_contrast_mode: manual
  manual_rna_min: 364.0                # MIAT-647, Brian (supersedes 300-3200)
  manual_rna_max: 1888.0
  manual_antibody_min: 563.0           # QKI-568, Brian (supersedes 531-2360)
  manual_antibody_max: 2500.0
  manual_rna2_min: 563.0               # mirror of the antibody pair — the renderer
  manual_rna2_max: 2500.0              # may read the rna2 slot
  manual_dapi_min: 334.0               # MEASURED: the value the QC pass actually applied
  manual_dapi_max: 2419.0              # (its run_config.json batch_contrast.dapi). NOT invented.
  apply_pub_contrast_floor_to_analysis: true   # emits the *_above_floor_* columns
  apply_pub_contrast_floor_to_spots: false     # ★ display must NEVER gate detection —
                                               # detection is gated by rna_overrides above
  prefix: ""
  scalebar_um: 25.0
  scalebar_font_px: 52

parallel:
  # -p 1 REQUIRED: compute_partner_intensity runs an in-process per-spot loop
  # that hangs the pool. main_workers is dead config in this version and the
  # main pass is serial regardless; seg_workers must stay 1 on DirectML.
  workers: 1
  seg_workers: 1
  main_workers: 1
  threads_per_worker: 4

qc:
  qc_min_nuclei: 10
  qc_saturated_frac: 0.001

seed: 0
