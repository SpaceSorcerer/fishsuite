nuclei:
  backend: cellpose
  cellpose_model_type: cpsam
  cellpose_diameter_px: 200.0          # ~13 um nucleus @ the measured 0.065 um/px
  cellpose_flow_threshold: 0.4
  cellpose_cellprob_threshold: 0.0
  cellpose_downsample_factor: 4.0      # ds4 -> 0.260 um/px seg grid; 2304/4 = 576 px
  cellpose_device: directml            # AMD RX 6750 XT; REQUIRES the fishproc_dml env
  min_area_px: 16000                   # 67.6 um^2
  max_area_px: 1000000000000.0
  exclude_border: true
  border_margin_px: 20                 # 1.3 um
  stardist_model: 2D_versatile_fluo
  prob_threshold: 0.5
  nms_threshold: 0.5
  stardist_gauss_sigma: 3.0
  stardist_postprocess: none
  label_smoothing_radius_px: 0
  reject_ghost_nuclei: false

sampling:
  # Matters MORE for a raw count than for a ratio metric: without it a confluent
  # field contributes more nuclei than a sparse one and the arms are not
  # comparable. Selects on DAPI + geometry ONLY, never on the RNA channel —
  # which is the outcome here.
  enabled: true
  n_per_unit: 10
  unit: per_image
  order: random
  seed: 0
  on_short: fail        # ★ CHANGED from `keep`. An ASSERTION now, not a filter:
                        # the triaged roster should contain no field with <10
                        # eligible nuclei. If it fires, investigate.

foci:
  enabled: true
  backend: bigfish
  bigfish_voxel_size_nm: 65.0          # MEASURED, uniform 88/88, UNBINNED
  bigfish_voxel_z_nm: 0.0              # moot — 2D detection on the MIP
  bigfish_spot_radius_nm: 120.0        # physical; 1.85 px at 65 nm/px
  bigfish_spot_radius_z_nm: 350.0      # MEASURED z-step; moot for 2D MIP detection
  threshold_multiplier: 1.0
  only_nuclear_spots: true
  min_sep_px: 1                        # Fiji-NMS knob; inert in the BigFISH wrapper
  detect_in_sec_only: true             # ★ the omission wells ARE the non-specific-rate
                                       # reference for this count — detected and REPORTED,
                                       # never subtracted
  partner_null_disk_px: 6.0            # INERT in rna_only (no partner channel, no null).
                                       # Set explicitly because the SCHEMA DEFAULT is 3.0,
                                       # which is the 130-nm-era value: leaving it unset lets
                                       # a copy-paste of this foci block into a two-channel
                                       # preset silently inherit a half-scale disk. 6 px x
                                       # 65 nm = 0.39 um, the same physical disk as the
                                       # canonical validated 3 px @ 0.130 um/px.
  # ★ THE DETECTION FLOOR — identical to the coloc preset.
  rna_overrides:
    min_spot_peak_intensity: 364.0

cytoplasm:
  enabled: true
  voronoi_max_expansion_px: 80         # 5.2 um @ 0.065 um/px
  measure_nc_ratio: true               # intensity-based % nuclear MIAT, the retention QC
                                       # that survives only_nuclear_spots: true

output:
  save_qc_overlays: true
  save_per_image_csv: true
  save_masks: true
  save_publication_images: true
  save_publication_tifs: false
  # Manual floors matching the coloc preset so the two runs' images are
  # directly comparable. DAPI is the QC pass's actually-applied value, not invented.
  pub_contrast_mode: manual
  manual_rna_min: 364.0                # MIAT-647, Brian
  manual_rna_max: 1888.0
  manual_dapi_min: 334.0               # MEASURED from the QC pass's batch_contrast.dapi
  manual_dapi_max: 2419.0
  apply_pub_contrast_floor_to_analysis: true
  apply_pub_contrast_floor_to_spots: false     # ★ this run IS the count — gating counts by a
                                               # display floor would be self-defeating, and it
                                               # would double-gate against rna_overrides
  prefix: ""
  scalebar_um: 25.0
  scalebar_font_px: 52

parallel:
  # No -p 1 requirement here (compute_partner_intensity is never set), but the
  # main pass is serial in this version regardless, so 1 costs nothing and keeps
  # provenance uniform with the coloc run.
  workers: 1
  seg_workers: 1                       # DirectML: one 12 GB GPU -> one segmentation worker
  main_workers: 1
  threads_per_worker: 4

qc:
  qc_min_nuclei: 10
  qc_saturated_frac: 0.001             # the _antibody variant is moot in rna_only

seed: 0
