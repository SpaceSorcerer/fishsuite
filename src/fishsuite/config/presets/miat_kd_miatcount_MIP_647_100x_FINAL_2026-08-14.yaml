channels:
  analysis_mode: rna_only       # MIAT COUNT — the protein channel is not read
  # ★ Do NOT set -1 here. In rna_only, auto-detect fails SILENTLY: it would hand
  # the `rna` role to the protein channel and count protein maxima under a MIAT
  # label, exit 0. There is no antibody slot whose absence would raise.
  dapi: 2                       # C2 = "405 CSU" -> DAPI (segmentation)
  rna: 0                        # C0 = "640 CSU" -> MIAT RNA-FISH
  antibody: -1                  # unused in rna_only
  rna2: -1
  one_indexed: false
  dapi_label: "DAPI"
  rna_label: "MIAT-647"
  dapi_lut: "blue"
  rna_lut: "yellow"

z_stack:
  # ★ MUST be `single` — see §Z. Under `autofocus`, rna_only.py IGNORES the
  # rna_start_slice/rna_end_slice MIP override, silently.
  mode: single
  # Left null so an unpinned file falls back to MID-STACK rather than plane 1 —
  # a less bad fallback, not a correct one. All 44 retained images ARE pinned
  # below, so the fallback should never be reached; if the dry-run roster shows
  # an image without a pin, stop.
  start_slice: null
  end_slice: null
  # 44 entries: DAPI pinned at F (start_slice == end_slice == F), MIAT MIP over
