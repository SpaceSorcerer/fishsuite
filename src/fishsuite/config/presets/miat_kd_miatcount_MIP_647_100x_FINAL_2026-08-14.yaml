# ############################################################################
# ##                                                                        ##
# ##   ███  FINAL MIAT COUNT RUN — NARROW MIP, PINNED PLANES, 44 IMAGES     ##
# ##                                                                        ##
# ##   This is the Q1 HEADLINE: MIAT puncta per nucleus, NT vs KD. It is    ##
# ##   the analysis of record for knockdown efficiency.                     ##
# ##                                                                        ##
# ##   ★ WHY THIS RUN AND NOT THE COLOC RUN GIVES THE COUNT. The FINAL      ##
# ##   coloc preset reads ONE optical section chosen by JOINT autofocus —   ##
# ##   a pick partly driven by the QKI channel. If that pick were           ##
# ##   arm-dependent it could manufacture a count difference. Here DAPI is  ##
# ##   pinned to plane F and MIAT is counted on a MIP of F+/-2, so the      ##
# ##   count is not hostage to the partner channel and a punctum spanning   ##
# ##   2-3 planes is not undercounted. The coloc run's single-plane count   ##
# ##   is a CONCORDANCE CHECK, not the headline.                            ##
# ##                                                                        ##
# ##   ★★ COLUMN-NAME TRAP: in rna_only the per-image count is the          ##
# ##   UNSUFFIXED `mean_spots_per_nucleus` (per-nucleus `rna_spot_count`).  ##
# ##   `mean_spots_per_nucleus_rna1` is the TWO-channel name and does not   ##
# ##   exist here — a script reading it off this run finds nothing.         ##
# ##                                                                        ##
# ############################################################################
# ============================================================================
# MIAT (647 RNA-FISH) NARROW-MIP PUNCTA COUNT — FINAL — 100x — rna_only
# Date: 2026-08-14 | acquisition 2026-08-12 | for MASTER CONTROL
#
# LINEAGE: miat_kd_miatcount_MIP_647_100x_2026-08-12 (inferred metadata)
#       -> ..._2026-08-13 (measured metadata, 65 nm rescale, F+/-2 derived,
#          placeholders deleted — NOT runnable, pins unwritten)
#       -> THIS FILE (final: 44 images, real pins, calibrated floor)
#
# Companion: miat_kd_qki_647_100x_FINAL_2026-08-14.yaml — SAME roster, SAME
# floor, SAME display ranges, SAME plane F per file. The two runs differ only
# in z treatment (MIP here, single plane there) and in what they measure.
# ★ Both must share the floor and the roster or the count and the association
# are not describing the same population.
#
# ── §WHAT CHANGED FOR THE FINAL RUN ────────────────────────────────────────
#   1. MIAT SPOT FLOOR PINNED at 364.0 — IDENTICAL to the coloc preset
#   2. 44-image roster via input_file_subset (7 excluded — see §ROSTER)
#   3. REAL PINS: DAPI at F, MIAT MIP over [F-2, F+2], clamped to [1, 38]
#   4. Manual display floors, matching the coloc preset
#   5. sampling.on_short: keep -> fail (roster triaged)
#
# ── §THE FLOOR — 364.0, DETECTION vs DISPLAY ──────────────────────────────
#   Brian's call; see the coloc preset's §THE FLOOR for the full rationale and
#   why the calibrated 3058 was rejected. Two distinct knobs, both 364.0:
#     - foci.rna_overrides.min_spot_peak_intensity: 364.0  <- DETECTION
#     - output.manual_rna_min: 364.0                       <- DISPLAY, and the
#       `rna_thresh_*` integration floor
#   `apply_pub_contrast_floor_to_spots` STAYS FALSE. On the COUNT preset that
#   is doubly important: this run IS the count, so letting a display floor gate
#   spot counts would be self-defeating, and it would double-gate against the
#   detection floor above.
#   Higher floors go in a POST-HOC sweep (0.8x / 1.0x / 1.2x, each in its own
#   output dir), reported alongside. The direction must hold across the sweep.
#
# ── §ROSTER — identical to the coloc preset, 44 images ────────────────────
#   51 discovered, 7 excluded, 44 kept = 17 NT (6 wells) + 15 KD (5 wells) +
#   12 omission. Every exclusion basename was confirmed to EXIST before being
#   excluded. EXCLUDED: NT_s1w1 FOV 07 (Brian's visual call); KD_s1w6 FOVs
#   15-20, the WHOLE WELL across the p2_ folder and its p2r_ reshoot (Brian's
#   visual call, corroborated — the five highest cytoplasmic-QKI images in the
#   dataset are all well 6; a well-level defect is dropped at the well).
#   RETAINED having been checked: KD_s1w5 FOVs 12, 13.
#   ★ A subset matching zero files raises; a subset matching the WRONG COUNT is
#   silent. The dry-run must read exactly 44 with the per-condition counts above.
#
# ── §Z — DAPI PINNED AT F, MIAT MIP OVER F+/-2 ───────────────────────────
#   mode: single. NOT autofocus, and this is REQUIRED, not a preference —
#   verified against core/modes/rna_only.py: under z_mode == "autofocus" the
#   code locks RNA to DAPI's autofocus plane and IGNORES rna_start_slice /
#   rna_end_slice, printing "per-channel RNA maxproj override IGNORED under
#   autofocus". Setting autofocus here would SILENTLY collapse this preset to
#   bare single-plane detection — the exact thing it exists to avoid — while
#   still looking correctly configured.
#
#   THE WINDOW IS F+/-2, DERIVED FROM THE MEASURED 0.35 um STEP:
#     F+/-1 : 3 planes, 1.05 um, ~70%   — too tight; the count then depends on
#                                         where in z the punctum happens to sit
#   ★ F+/-2 : 5 planes, 1.75 um, ~96%   — USED HERE
#     F+/-3 : 7 planes, 2.45 um, ~99.8% — +4% signal for 2 pure-background
#                                         planes per side; background up ~1.18x
#   (The earlier F+/-3 in the 08-12 preset assumed a 0.30 um step. The step is
#   measured 0.35 um. The NA 1.45 / n 1.518 figure behind the ~0.8 um axial PSF
#   is an assumption, not read from the files; at NA 1.40 the choice is unchanged.)
#
#   All 44 windows come from the QC pass's F+/-2 variant
#   (QC_ANALYSIS/06_make_pin_overrides/file_overrides_mip_window.yaml), and every
#   one was re-verified programmatically as rna_start == max(1, F-2) and
#   rna_end == min(38, F+2) against that file's own F. No window was hand-edited.
#   n_z is 38 on all retained images, so no window actually clamps in this set.
#
#   ★ PINS OUTSIDE BRIAN'S IDEAL 10-17 — 13 of 44, reported not moved, and the
#   pattern is systematic: stained images (n=32) span z 8-19 with median 13 and
#   only three outside; omission images (n=12) span z 16-27 with median 22.5,
#   ten of twelve above 17 and two (Sec-Only-MIAT-QKI-NT_55 at z=26, _59 at
#   z=27) beyond even the 8-23 acceptable window. Likely mechanism: joint
#   autofocus multiplies normalised focus scores across DAPI + MIAT + QKI, and
#   an omission well carries no specific signal in two of those three channels.
#   See the coloc preset's §Z. It matters here because the omission wells are
#   the non-specific-rate reference for this count.
#
# ── §OUTPUT COLUMN NAME ───────────────────────────────────────────────────
#   rna_only emits the UNSUFFIXED `mean_spots_per_nucleus` per image and
#   `rna_spot_count` per nucleus. NOT `mean_spots_per_nucleus_rna1` — that is
#   the two-channel-mode name (verified in core/excel_report.py).
#
# ── §HOW TO RUN ───────────────────────────────────────────────────────────
#   fishproc_dml env, ONE GPU run at a time, foreground, --dry-run FIRST and
#   CHECK THE ROSTER READS 44. This preset does NOT need -p 1 — it never sets
#   compute_partner_intensity — but the main pass is serial regardless in this
#   version, so -p 1 costs nothing and keeps provenance uniform with the coloc run.
# ============================================================================

experiment:
  name: "FINAL_MIAT_KD_MIATCOUNT_MIP_647_100x_2026-08-14"
  description: "FINAL rna_only MIAT-647 puncta count via a narrow MIP — the Q1 knockdown-efficiency headline and the analysis of record for MIAT spots per nucleus. Acquired 2026-08-12; QC pass 2026-08-13; final preset 2026-08-14. Kept separate from the coloc run because that run picks one plane by JOINT autofocus partly driven by the QKI channel, so an arm-dependent pick could manufacture a count difference; here DAPI is pinned to F and MIAT is counted on a MIP of F+/-2 (5 planes, 1.75 um at the measured 0.35 um z-step, ~96% of a ~0.8 um axial PSF), clamped to [1,38]. z_stack.mode is single and NOT autofocus — verified against core/modes/rna_only.py, autofocus silently IGNORES the rna_start_slice/rna_end_slice MIP override and would collapse this to bare single-plane detection. All 44 windows come from the QC pass's F+/-2 variant and were re-verified programmatically as max(1,F-2)..min(38,F+2); no window hand-edited. Roster is IDENTICAL to the FINAL coloc preset: 51 discovered, 7 excluded (NT_s1w1 FOV 07; the whole KD_s1w6 well, FOVs 15-20 across the p2_ folder and its p2r_ reshoot), 44 kept = 17 NT / 6 wells + 15 KD / 5 wells + 12 omission, every exclusion basename confirmed to exist first. MIAT spot floor PINNED at 364.0 via foci.rna_overrides.min_spot_peak_intensity, identical to the coloc preset — the count and the association must describe the same spot population. Display floors manual and matching: MIAT 364-1888, DAPI 334-2419 read from the QC pass's applied batch_contrast rather than invented. apply_pub_contrast_floor_to_spots stays FALSE, which matters doubly here since this run IS the count. sampling.on_short is now fail, the roster having been triaged. 13 of 44 pinned planes fall outside Brian's ideal 10-17 window and are REPORTED not moved; ten of those thirteen are omission images, whose joint-autofocus picks drift because two of three channels carry no specific signal. Per-image count column is the UNSUFFIXED mean_spots_per_nucleus, per-nucleus rna_spot_count. Human/Homo sapiens, H9 hESC undifferentiated."
  cell_line: "H9 hESC (undifferentiated)"
  date: "2026-08-12"          # ACQUISITION date. Final preset written 2026-08-14.

