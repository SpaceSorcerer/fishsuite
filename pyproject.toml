[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fishsuite"
version = "0.1.0"
description = "Standalone Python pipeline for RNA-FISH / IF quantification & colocalization (Fiji-free)"
readme = "README.md"
# Upper bound is forced by numpy<2.0, which is itself a TensorFlow/StarDist
# transitive constraint and NOT a requirement of fishsuite's own code (the suite
# is green on numpy 2.5.2 in a light environment). There are no numpy 1.x wheels
# for CPython 3.13, so installing there tries to build numpy from source and
# fails. Verified 2026-08-09.
# Relaxing this means moving stardist (and the numpy cap with it) into an extra,
# which also means nuclei.backend can no longer default to stardist in a base
# install. Deferred deliberately rather than shipping a default backend the base
# install cannot run.
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Brian Amburn", email = "gsdewson@utmb.edu" },
]
keywords = ["microscopy", "FISH", "colocalization", "stardist", "cellpose", "bigfish"]

dependencies = [
    "numpy>=1.24,<2.0",
    "scipy>=1.10",
    "scikit-image>=0.22",
    "tifffile>=2024.1",
    "stardist>=0.9",
    # cellpose 4.x changed the model API; the vendored segmentation code targets 3.x.
    "cellpose>=3.0,<4.0",
    "big-fish>=0.6",
    # torch arrives transitively via cellpose, but fishsuite imports it directly
    # (core/parallel.py, core/repro.py) so it is declared explicitly.
    "torch>=2.0",
    # Imported directly by core/output.py, core/coloc_backfill.py and
    # core/walkthrough_figure.py; previously undeclared.
    "pillow>=10.0",
    # ImageJ ROI export in core/_vendor/segmentation/segment_image.py.
    "roifile>=2023.8",
    "bioio>=3.0",
    "bioio-bioformats>=2.0",
    "pydantic>=2.5",
    "click>=8.1",
    "rich>=13.0",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
]
gui = [
    "PySide6>=6.6",
]
# AMD GPU acceleration for cellpose. Windows only, and opt-in: CUDA and CPU
# users must not be made to install it.
directml = [
    "torch-directml>=0.2 ; sys_platform == 'win32'",
]

[project.scripts]
fishsuite = "fishsuite.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/fishsuite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "lab: requires the original image-analysis-pipeline tree on this machine",
    "gpu: requires a GPU (DirectML or CUDA)",
    "heavy: slow; needs the full ML stack (StarDist/TensorFlow, cellpose/torch)",
    "bioformats: requires bioio-bioformats and a JVM",
]

[tool.ruff]
# Vendored code is copied verbatim and checksum-recorded; reformatting it would
# break the provenance record in core/_vendor/PROVENANCE.md.
extend-exclude = ["src/fishsuite/core/_vendor"]
