[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fishsuite"
version = "1.0.0"
description = "Standalone Python pipeline for RNA-FISH / IF quantification & colocalization (Fiji-free)"
readme = "README.md"
# Upper bound is forced by numpy<2.0, which is itself a TensorFlow/StarDist
# transitive constraint and NOT a requirement of fishsuite's own code (the suite
# is green on numpy 2.5.2 in a light environment). There are no numpy 1.x wheels
# for CPython 3.13, so installing there tries to build numpy from source and
# fails. Verified 2026-08-09.
# Relaxing this means moving stardist (and the numpy cap with it) into an extra,
# which also means nuclei.backend can no longer default to stardist in a base
# install. Deferred deliberately rather than shipping a default backend the base
# install cannot run.
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Brian Amburn", email = "gsdewson@utmb.edu" },
]
keywords = ["microscopy", "FISH", "colocalization", "stardist", "cellpose", "bigfish"]

dependencies = [
    "numpy>=1.24,<2.0",
    "scipy>=1.10",
    "scikit-image>=0.22",
    "tifffile>=2024.1",
    "stardist>=0.9",
    # cellpose 4.x changed the model API; the vendored segmentation code targets 3.x.
    "cellpose>=3.0,<4.0",
    "big-fish>=0.6",
    # torch arrives transitively via cellpose, but fishsuite imports it directly
    # (core/parallel.py, core/repro.py) so it is declared explicitly.
    "torch>=2.0",
    # Imported directly by core/output.py, core/coloc_backfill.py and
    # core/walkthrough_figure.py; previously undeclared.
    "pillow>=10.0",
    # ImageJ ROI export in core/_vendor/segmentation/segment_image.py.
    "roifile>=2023.8",
    "bioio>=3.0",
    # NOTE: bioio-bioformats is NOT here — it is the `bioformats` extra below.
    # Keeping it in the base set made `pip install fishsuite` IMPOSSIBLE to
    # resolve on every Python version: bioio-bioformats pulls bffile, which
    # requires numpy>=2.1.0, against the numpy<2.0 pin above. See the extra.
    "pydantic>=2.5",
    "click>=8.1",
    "rich>=13.0",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "ruff>=0.6",
    "build>=1.0",
    "twine>=5.0",
]
gui = [
    "PySide6>=6.6",
]
# AMD GPU acceleration for cellpose. Windows only, and opt-in: CUDA and CPU
# users must not be made to install it.
directml = [
    "torch-directml>=0.2 ; sys_platform == 'win32'",
]
# Bio-Formats reader, for the proprietary microscope formats: .vsi, .czi, .lif,
# .nd2, .oib/.oif. Moved OUT of the base dependencies on 2026-08-10 because it
# made the package uninstallable: bioio-bioformats -> bffile requires
# numpy>=2.1.0, which contradicts the numpy<2.0 pin that StarDist/TensorFlow
# force, so `pip install fishsuite` failed with ResolutionImpossible on every
# Python version. It is also the single largest install-failure surface for an
# outside user, because it needs a JVM: a JDK must be present, and the
# Bio-Formats jars are downloaded on first use.
#
# Consequence, stated plainly: a base install reads TIFF / OME-TIFF only. Any
# proprietary format needs `pip install "fishsuite[bioformats]"`.
# The floor is 1.3 rather than 2.0 SO THAT PIP CAN SOLVE THIS AT ALL. pip tries
# 2.0.0 first, hits the bffile/numpy wall, and backtracks to 1.3.2, which does
# not depend on bffile and accepts numpy>=1.21. Pinning >=2.0 here would leave
# the extra as uninstallable as the base set was.
#
# UNVALIDATED VERSION SKEW, read before publishing numbers: the author's own
# environment runs bioio-bioformats 2.0.0 (with bffile 0.1.1 on numpy 1.26.4 —
# it works in practice, so bffile's declared numpy>=2.1.0 floor is stricter than
# reality). An outside user resolving this extra gets 1.3.2 instead. Whether the
# two reader versions return byte-identical pixels has NOT been checked. That is
# a parity question, not a packaging one — see CONTRIBUTING.md on changes that
# can move a computed number.
bioformats = [
    "bioio-bioformats>=1.3",
]
# Everything an interactive workstation wants. Deliberately EXCLUDES `directml`,
# which is AMD-and-Windows-only, and `dev`.
all = [
    "fishsuite[bioformats,gui]",
]

[project.scripts]
fishsuite = "fishsuite.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/fishsuite"]
# Of the 48 presets in the repository, 42 are RUN RECORDS, not templates: they
# carry `input_file_subset` naming the author's own .vsi files, or
# `z_stack.file_overrides` keyed to literal filenames, or `cellpose_device:
# directml` (AMD-only). An external user who ran one would discover zero images
# with no clear error. They stay in the repository — they are the provenance of
# published figures — but they must not ship to someone who cannot use them.
#
# This is deliberately DENY-ALL-THEN-ALLOW rather than a list of the 42 to drop.
# An exclusion list would silently start shipping the next lab preset added to
# this folder; an allowlist keeps that from being possible. To ship a new preset,
# mark it `# portable: true` and add it to force-include below.
exclude = [
    "src/fishsuite/config/presets/*.yaml",
    "src/fishsuite/config/presets_archive_scratch_2026-07-09",
]

[tool.hatch.build.targets.wheel.force-include]
"src/fishsuite/config/presets/generic_100x_0p065.yaml" = "fishsuite/config/presets/generic_100x_0p065.yaml"
"src/fishsuite/config/presets/generic_60x_0p108.yaml" = "fishsuite/config/presets/generic_60x_0p108.yaml"
"src/fishsuite/config/presets/u2os_100x.yaml" = "fishsuite/config/presets/u2os_100x.yaml"
"src/fishsuite/config/presets/hek293_60x.yaml" = "fishsuite/config/presets/hek293_60x.yaml"
# Written from scratch for the release rather than stripped from a lab preset,
# because the tool's headline capability is two-channel colocalization and every
# other portable preset is rna_only.
"src/fishsuite/config/presets/generic_rna_rna_100x.yaml" = "fishsuite/config/presets/generic_rna_rna_100x.yaml"
"src/fishsuite/config/presets/generic_rna_protein_100x.yaml" = "fishsuite/config/presets/generic_rna_protein_100x.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "lab: requires the original image-analysis-pipeline tree on this machine",
    "gpu: requires a GPU (DirectML or CUDA)",
    "heavy: slow; needs the full ML stack (StarDist/TensorFlow, cellpose/torch)",
    "bioformats: requires bioio-bioformats and a JVM",
]

[tool.ruff]
# Vendored code is copied verbatim and checksum-recorded; reformatting it would
# break the provenance record in core/_vendor/PROVENANCE.md.
extend-exclude = ["src/fishsuite/core/_vendor"]

[tool.ruff.lint]
# CI gates on this set and it passes clean. Deliberately narrow: every rule here
# flags code that is *wrong* (a NameError waiting to happen, a redefinition that
# silently discards a definition, a format string that will not render), not code
# that is merely unfashionable. A gate that fires on style gets switched off.
#
# NOT selected, and why:
#   E501  line length — cosmetic.
#   E4/E7 import placement and semicolons — cosmetic. E712 (`== True`) is worse
#         than cosmetic here: it is *wrong advice* for pandas, where
#         `series == True` is the idiomatic elementwise mask and `if series`
#         raises. Selecting it would push a real regression.
#   F401 unused-import / F841 unused-variable / F541 f-string-without-placeholder
#         — 72 findings as of 2026-08-10. Real debt, but clearing it means
#         deleting imports and locals from a numerical pipeline, which is a
#         deliberate change with a full test run behind it, not a drive-by in a
#         release branch. See CONTRIBUTING.md.
select = [
    "E9",               # syntax errors / IO errors
    "F502", "F506", "F522", "F524",   # broken %-format and .format() calls
    "F601", "F632",                   # `is` compared against a literal
    "F701", "F702", "F706", "F707",   # misplaced break/continue/return/except
    "F811",                           # redefinition of an unused name
    "F821", "F822", "F823",           # undefined name / undefined __all__ / used-before-assign
    "F901",                           # raise NotImplemented (should be NotImplementedError)
]
